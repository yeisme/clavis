name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy-and-cross-compile:
    name: clavis / policy & cross-build-vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check whitespace and conflict markers
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^..HEAD
          else
            git diff --check
          fi

      - name: Validate shell scripts and git hooks syntax
        run: |
          find scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          if [ -d .githooks ]; then
            find .githooks -type f -print0 | xargs -0 -n1 bash -n
          fi

      - name: Validate mygo.json manifest and macOS usage descriptions
        run: |
          python3 -m json.tool mygo.json > /dev/null
          python3 - <<'PY'
          import json
          data = json.load(open("mygo.json", encoding="utf-8"))
          for key in ("name", "slug", "identifier", "version"):
              assert isinstance(data.get(key), str) and data[key].strip(), f"missing or invalid mygo.json key: {key}"
          plist = data.get("macos", {}).get("infoPlist", {})
          for key in (
              "NSAccessibilityUsageDescription",
              "NSInputMonitoringUsageDescription",
              "NSAppleEventsUsageDescription",
              "NSScreenCaptureUsageDescription",
          ):
              assert isinstance(plist.get(key), str) and plist[key].strip(), f"missing macOS usage description: {key}"
          PY

      - name: Cross-compile and vet (Linux, Windows, macOS)
        run: |
          go vet ./...
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go vet ./...
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build ./...
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go vet ./...
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go vet ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ./...
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go vet ./...

      - name: Cross-compile Windows bridge & capture test binaries
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go test -c -o /dev/null ./internal/bridge
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go test -c -o /dev/null ./internal/capture

  macos-test:
    name: clavis / macos-test
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Record runner environment
        run: |
          go version
          uname -a
          echo "SHA=$(git rev-parse HEAD)"

      - name: Validate mygo.json manifest
        run: python3 -m json.tool mygo.json > /dev/null

      - name: Run full test suite
        run: go test -count=1 ./...

      - name: Native build & vet
        run: |
          go build ./...
          go vet ./...

      - name: Smoke-check, self-check & sync plan (isolated HOME)
        run: |
          ISOLATED_HOME="$(mktemp -d)"
          GOPATH_VAL="$(go env GOPATH)"
          GOMODCACHE_VAL="$(go env GOMODCACHE)"
          GOCACHE_VAL="$(go env GOCACHE)"
          trap 'rm -rf "$ISOLATED_HOME"' EXIT
          HOME="$ISOLATED_HOME" GOPATH="$GOPATH_VAL" GOMODCACHE="$GOMODCACHE_VAL" GOCACHE="$GOCACHE_VAL" go run . --smoke-check
          HOME="$ISOLATED_HOME" GOPATH="$GOPATH_VAL" GOMODCACHE="$GOMODCACHE_VAL" GOCACHE="$GOCACHE_VAL" go run . --self-check
          HOME="$ISOLATED_HOME" GOPATH="$GOPATH_VAL" GOMODCACHE="$GOMODCACHE_VAL" GOCACHE="$GOCACHE_VAL" go run ./cmd/clavis sync plan

      - name: Verify -ldflags -X version injection
        run: |
          go build -ldflags "-X main.clavisBuildVersion=0.2.0-ci" -o /tmp/clavis-ci-ver .
          ver_out="$(/tmp/clavis-ci-ver --version)"
          echo "$ver_out"
          [[ "$ver_out" == *"0.2.0-ci"* ]]
          rm -f /tmp/clavis-ci-ver

  macos-race:
    name: clavis / macos-race
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run race detector across uiapp, watcher, core & daemon
        run: |
          go test -count=1 -race \
            ./uiapp \
            ./internal/watcher \
            ./internal/secrets/... \
            ./internal/storage/... \
            ./internal/sync/... \
            ./internal/daemon/... \
            ./internal/diag/... \
            ./internal/filesearch/... \
            ./pkg/core/... \
            ./cmd/clavis/... \
            .

  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    # Clavis is a macOS launcher (see README): Windows is a portability surface for pkg/ and internal/, not a
    # supported target. This job has never been green — the failures are real Windows semantics (file permissions
    # in secrets.FileStore, user-dictionary paths, clipboard probes, absolute working_dir validation), not flaky
    # tests — and leaving it red blocks every merge on work nobody is doing yet.
    #
    # continue-on-error keeps the signal without blocking: the job still runs on every push, its result is still
    # visible on the run page, and the moment Windows support is actually worked on this line comes off. This is
    # deliberately not `if: false` and not deleting the job — that would hide the gap instead of recording it.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Go vet
        run: go vet ./...

      - name: Run Windows package tests
        run: >-
          go test -count=1
          ./pkg/...
          ./internal/bridge/...
          ./internal/capture/...
          ./internal/secrets/...
          ./internal/sync/...
          ./cmd/clavis/...

  test-linux:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Go vet
        run: go vet ./...

      - name: Run Linux package tests with race detector
        run: >-
          go test -count=1 -race
          ./pkg/...
          ./internal/secrets/...
          ./internal/storage/...
          ./internal/sync/...
          ./internal/daemon/...
          ./internal/diag/...
          ./internal/filesearch/...
          ./cmd/clavis/...

  required-summary:
    name: clavis / required-checks
    runs-on: ubuntu-latest
    needs: [policy-and-cross-compile, macos-test, macos-race, test-linux]
    if: always()
    steps:
      - name: Assert all required checks succeeded
        run: |
          echo "policy-and-cross-compile=${{ needs.policy-and-cross-compile.result }}"
          echo "macos-test=${{ needs.macos-test.result }}"
          echo "macos-race=${{ needs.macos-race.result }}"
          echo "test-linux=${{ needs.test-linux.result }}"
          for res in \
            "${{ needs.policy-and-cross-compile.result }}" \
            "${{ needs.macos-test.result }}" \
            "${{ needs.macos-race.result }}" \
            "${{ needs.test-linux.result }}"; do
            if [ "$res" != "success" ]; then
              echo "Required check did not succeed: $res"
              exit 1
            fi
          done
