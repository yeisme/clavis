name: Release Candidate

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref or SHA from main to package"
        required: true
        default: "main"
        type: string
      clavis_version:
        description: "Explicit release candidate version (e.g. 1.0.0-rc.1)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  candidate-macos-arm64:
    name: Candidate Build & Clean DMG Install Verify
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate candidate version & runner
        run: |
          ver="${{ inputs.clavis_version }}"
          ver="${ver#v}"
          if [[ -z "$ver" || "$ver" =~ [[:space:]/] ]]; then
            echo "invalid clavis_version: '${{ inputs.clavis_version }}'" >&2
            exit 1
          fi
          echo "SOURCE_SHA=$(git rev-parse HEAD)"
          echo "CLAVIS_VERSION=$ver" >> "$GITHUB_ENV"
          uname -m
          go version

      - name: Full mechanical gate
        run: |
          find scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          python3 -m json.tool mygo.json > /dev/null
          go vet ./...
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go vet ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go vet ./...
          go test -count=1 ./...
          go test -count=1 -race ./uiapp ./internal/watcher ./internal/secrets/... ./internal/storage/... ./internal/sync/... ./internal/daemon/... ./internal/diag/... ./internal/filesearch/... ./pkg/core/... ./cmd/clavis/... .

      - name: Build macOS arm64 DMG, ZIP & CLI
        run: |
          CLAVIS_VERSION="$CLAVIS_VERSION" ./scripts/package.sh

      - name: Mount DMG, clean-install & verify bundle
        run: |
          DMG="build/darwin-arm64/clavis-${CLAVIS_VERSION}-arm64.dmg"
          test -f "$DMG"
          MOUNT_DIR="$(mktemp -d /tmp/clavis-dmg-mnt.XXXXXX)"
          INSTALL_DIR="$(mktemp -d /tmp/clavis-install-test.XXXXXX)"
          ISOLATED_HOME="$(mktemp -d /tmp/clavis-rc-home.XXXXXX)"
          cleanup() {
            hdiutil detach "$MOUNT_DIR" -force >/dev/null 2>&1 || true
            rm -rf "$MOUNT_DIR" "$INSTALL_DIR" "$ISOLATED_HOME"
          }
          trap cleanup EXIT

          hdiutil attach "$DMG" -mountpoint "$MOUNT_DIR" -nobrowse -readonly
          ditto "$MOUNT_DIR/Clavis.app" "$INSTALL_DIR/Clavis.app"
          hdiutil detach "$MOUNT_DIR"

          APP="$INSTALL_DIR/Clavis.app"
          file "$APP/Contents/MacOS/Clavis" | grep -q "arm64"
          plutil -lint "$APP/Contents/Info.plist"
          codesign --verify --deep --strict --verbose=2 "$APP"
          ver_out="$("$APP/Contents/MacOS/Clavis" --version)"
          echo "Installed --version: $ver_out"
          [[ "$ver_out" == *"$CLAVIS_VERSION"* ]]
          HOME="$ISOLATED_HOME" "$APP/Contents/MacOS/Clavis" --smoke-check
          HOME="$ISOLATED_HOME" "$APP/Contents/MacOS/Clavis" --self-check

          (cd build/darwin-arm64 && shasum -a 256 -c "clavis-${CLAVIS_VERSION}-arm64.dmg.sha256" && shasum -a 256 -c clavis-cli.sha256 && shasum -a 256 -c Clavis.app.sha256)
          (cd build && shasum -a 256 -c "clavis-${CLAVIS_VERSION}-darwin-arm64.zip.sha256")

      - name: Upload candidate artifacts (14 days)
        uses: actions/upload-artifact@v4
        with:
          name: clavis-candidate-${{ env.CLAVIS_VERSION }}-darwin-arm64
          retention-days: 14
          path: |
            build/darwin-arm64/clavis-*-arm64.dmg
            build/darwin-arm64/clavis-*-arm64.dmg.sha256
            build/darwin-arm64/clavis-cli
            build/darwin-arm64/clavis-cli.sha256
            build/darwin-arm64/Clavis.app.sha256
            build/clavis-*-darwin-arm64.zip
            build/clavis-*-darwin-arm64.zip.sha256
